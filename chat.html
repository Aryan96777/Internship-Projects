<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Intern Chat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 500px; background: white; display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .received { background: #f1f0f0; align-self: flex-start; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .input-area { display: flex; padding: 10px; background: #eee; }
        input { flex: 1; padding: 10px; border: none; border-radius: 20px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 50%; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Global Intern Chat</div>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCo7duaqZIsrAvYTgqGCQZX3ZDrsxL27q8",
        authDomain: "expense-tracker-3bf8f.firebaseapp.com",
        projectId: "expense-tracker-3bf8f",
        storageBucket: "expense-tracker-3bf8f.firebasestorage.app",
        messagingSenderId: "296231343236",
        appId: "1:296231343236:web:0ae14304af12b45a161ed1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesCol = collection(db, "messages");

    // Send Message
    window.sendMessage = async () => {
        const text = document.getElementById('msgInput').value;
        if(text.trim() !== "") {
            await addDoc(messagesCol, {
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('msgInput').value = "";
        }
    };

    // Listen for Messages
    const q = query(messagesCol, orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = "";
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            div.classList.add('msg', 'received'); // Default look
            div.textContent = data.text;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // Send with Enter key
    document.getElementById('msgInput').addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #2c3e50; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #219150; }
        .chart-container { margin-top: 30px; width: 100%; height: 250px; }
        .list-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>Expense Tracker</h2>
    <input type="text" id="itemName" placeholder="Item Name (e.g., Coffee)">
    <input type="number" id="itemAmt" placeholder="Amount (₹)">
    <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
    </select>
    <button onclick="addExpense()">Add Expense</button>

    <div class="chart-container">
        <canvas id="expenseChart"></canvas>
    </div>

    <div id="expenseList" style="margin-top: 20px;"></div>
</div>

<script type="module">
    // Firebase Import
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // YOUR ACTUAL CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyCo7duaqZIsrAvYTgqGCQZX3ZDrsxL27q8",
        authDomain: "expense-tracker-3bf8f.firebaseapp.com",
        projectId: "expense-tracker-3bf8f",
        storageBucket: "expense-tracker-3bf8f.firebasestorage.app",
        messagingSenderId: "296231343236",
        appId: "1:296231343236:web:0ae14304af12b45a161ed1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "expenses");

    // Chart Setup
    let myChart;
    const ctx = document.getElementById('expenseChart').getContext('2d');

    window.addExpense = async () => {
        const name = document.getElementById('itemName').value;
        const amt = document.getElementById('itemAmt').value;
        const cat = document.getElementById('category').value;

        if(name && amt) {
            await addDoc(colRef, { name, amt: Number(amt), category: cat, date: new Date() });
            document.getElementById('itemName').value = '';
            document.getElementById('itemAmt').value = '';
        }
    };

    // Real-time listener to update List and Chart
    onSnapshot(colRef, (snapshot) => {
        let items = [];
        let totals = { Food: 0, Transport: 0, Bills: 0, Entertainment: 0 };
        let listHtml = "";

        snapshot.docs.forEach(doc => {
            const data = doc.data();
            items.push(data);
            totals[data.category] += data.amt;
            listHtml += `<div class="list-item"><span>${data.name}</span><strong>₹${data.amt}</strong></div>`;
        });

        document.getElementById('expenseList').innerHTML = listHtml;
        updateChart(totals);
    });

    function updateChart(totals) {
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(totals),
                datasets: [{
                    data: Object.values(totals),
                    backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0']
                }]
            }
        });
    }
</script>
</body>
</html>
